name: Publish

on:
    push:
        tags: ['v*']

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write # Required by SectorLabs/actions/codeartifact-publish

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - run: npm ci
            - run: npm run verify
            - run: npm run build

            - name: Compute version
              id: version
              run: echo "version=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

            - name: Set version
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.version }}
              run: npm version --allow-same-version --no-git-tag-version "${RELEASE_TAG}"

            - name: Publish to CodeArtifact
              uses: SectorLabs/actions/codeartifact-publish@5dfed53e9c49cd74e0731f3de4339bea60d15614 # codeartifact-publish-v1.0.0
              with:
                  role-arn: ${{ vars.ENVIRONMENT_PUBLISH_AWS_OIDC_IAM_ROLE_ARN }}
                  format: npm
